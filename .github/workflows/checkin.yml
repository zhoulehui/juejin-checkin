name: Schedule Test

on:
  push:
    branches:
      - main

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 测试定时任务
        run: |
          echo "GitHub Actions 运行成功"
          echo "触发方式：${{ github.event_name }}"
          date -u
