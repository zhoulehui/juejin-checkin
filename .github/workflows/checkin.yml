name: Schedule Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 测试定时任务
        run: |
          echo "========================================"
          echo "GitHub Actions 定时任务触发成功！"
          echo "当前 UTC 时间："
          date -u
          echo "当前时间："
          date
          echo "========================================"
